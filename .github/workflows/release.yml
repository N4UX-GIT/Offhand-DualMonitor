name: Build and Release

env:
  # Addon-only releases reuse these exact, already-published Companion bytes.
  # Change both values only for a deliberate Companion release.
  COMPANION_RELEASE_TAG: v2.1.2-beta.18
  COMPANION_SHA256: A42A45CB149C66EF884308F15A79EE8905C58A94E9B4AE1A3B05B43BAF929F37
  COMPANION_ARCHIVE_SHA256: AD49BE14A9C8ADF5A888F873CE9B99F183C4AD2924909ECDF52801F303248A93

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Determine release lane
      id: policy
      shell: powershell
      run: |
        $changed = "${{ github.ref_name }}" -eq $env:COMPANION_RELEASE_TAG
        "companion_changed=$($changed.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Validate canonical Companion executable
      if: steps.policy.outputs.companion_changed == 'true'
      shell: powershell
      run: |
        $path = 'Companion\Offhand.exe'
        $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
        if ($actual -ne $env:COMPANION_SHA256) {
          throw "Checked-in Companion hash $actual does not match $env:COMPANION_SHA256."
        }
        if ((Get-Item -LiteralPath $path).VersionInfo.ProductVersion -ne '2.1.2-beta.18') {
          throw 'Checked-in Companion product version is not 2.1.2-beta.18.'
        }

    - name: Restore frozen Beta 18 Companion
      if: steps.policy.outputs.companion_changed != 'true'
      shell: powershell
      run: |
        .\scripts\Restore-FrozenCompanion.ps1 `
          -Tag $env:COMPANION_RELEASE_TAG `
          -ExpectedSha256 $env:COMPANION_SHA256

    - name: Build and Package
      shell: powershell
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        if ("${{ steps.policy.outputs.companion_changed }}" -eq "true") {
          .\package.ps1 -Version $version -CompanionChanged -UseExistingCompanion
        } else {
          .\package.ps1 -Version $version
        }

    - name: Validate canonical Companion archive
      if: steps.policy.outputs.companion_changed == 'true'
      shell: powershell
      run: |
        Add-Type -AssemblyName System.IO.Compression
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $archive = [IO.Compression.ZipFile]::OpenRead('dist\Offhand-Companion.zip')
        try {
          $expectedEntries = @('LICENSE', 'Offhand.exe', 'README.txt')
          foreach ($required in $expectedEntries) {
            if (-not $archive.GetEntry($required)) {
              throw "Companion archive is missing $required."
            }
          }
          $actualEntries = @($archive.Entries | ForEach-Object FullName | Sort-Object)
          if (($actualEntries -join "`n") -ne ($expectedEntries -join "`n")) {
            throw "Companion archive contains unexpected files: $($actualEntries -join ', ')"
          }
          $entry = $archive.GetEntry('Offhand.exe')
          $stream = $entry.Open()
          $sha256 = [Security.Cryptography.SHA256]::Create()
          try {
            $actual = ([BitConverter]::ToString($sha256.ComputeHash($stream))).Replace('-', '')
          } finally {
            $sha256.Dispose()
            $stream.Dispose()
          }
          if ($actual -ne $env:COMPANION_SHA256) {
            throw "Companion archive contains executable hash $actual, expected $env:COMPANION_SHA256."
          }
        } finally {
          $archive.Dispose()
        }

    - name: Attach frozen Beta 18 Companion assets
      if: steps.policy.outputs.companion_changed != 'true'
      shell: powershell
      run: |
        .\scripts\Restore-FrozenCompanion.ps1 `
          -Tag $env:COMPANION_RELEASE_TAG `
          -ExpectedSha256 $env:COMPANION_SHA256 `
          -ArchiveDestination "dist\Offhand-Companion.zip" `
          -ExpectedArchiveSha256 $env:COMPANION_ARCHIVE_SHA256
        Copy-Item -LiteralPath "Companion\Offhand.exe" -Destination "dist\Offhand.exe" -Force
        foreach ($path in @("dist\Offhand-Companion.zip", "dist\Offhand.exe")) {
          $file = Get-Item -LiteralPath $path
          $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
          "$hash  $($file.Name)" | Add-Content -LiteralPath "dist\checksums-sha256.txt" -Encoding UTF8
        }

    - name: Create standardized release metadata
      id: metadata
      shell: powershell
      run: |
        $arguments = @{
          Tag = "${{ github.ref_name }}"
          Repository = "${{ github.repository }}"
          CompanionReleaseTag = $env:COMPANION_RELEASE_TAG
          OutputPath = "dist\release-notes.md"
          GitHubOutputPath = $env:GITHUB_OUTPUT
        }
        if ("${{ steps.policy.outputs.companion_changed }}" -eq "true") {
          $arguments.CompanionChanged = $true
        }
        .\scripts\New-ReleaseMetadata.ps1 @arguments

    - name: Attest addon and complete bundle provenance
      uses: actions/attest@v4
      with:
        subject-path: |
          dist/Offhand-v*.zip
          dist/Offhand-Complete-v*.zip
          dist/checksums-sha256.txt

    - name: Attest updated Companion provenance
      if: steps.policy.outputs.companion_changed == 'true'
      uses: actions/attest@v4
      with:
        subject-path: |
          dist/Offhand-Companion.zip
          dist/Offhand.exe

    - name: Create Release and upload addon assets
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ steps.metadata.outputs.release_name }}
        body_path: dist/release-notes.md
        prerelease: ${{ steps.metadata.outputs.prerelease }}
        files: |
          dist/Offhand-v*.zip
          dist/Offhand-Companion.zip
          dist/Offhand-Complete-v*.zip
          dist/Offhand.exe
          dist/checksums-sha256.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


