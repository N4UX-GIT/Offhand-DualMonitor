name: Build and Release

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build and Package
      shell: powershell
      run: |
        # Run the packaging script. It automatically compiles the C# app 
        # and generates the .zip files in the dist/ folder.
        # We extract the version from the tag (e.g., v1.0.1 -> 1.0.1)
        $version = "${{ github.ref_name }}".TrimStart('v')
        .\package.ps1 -Version $version

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/Offhand-v*.zip
          dist/Offhand-Companion.zip
          dist/Offhand.exe
          dist/checksums-sha256.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload to CurseForge
      uses: itsmeow/curseforge-upload@v3
      with:
        token: ${{ secrets.CURSEFORGE_TOKEN }}
        project_id: 1696140
        game_endpoint: wow
        file_path: dist/Offhand-${{ github.ref_name }}.zip
        changelog: "Please see the GitHub Releases page for the full changelog."
        changelog_type: markdown
        display_name: "Offhand ${{ github.ref_name }}"
        release_type: beta
        game_versions: "11596, 11925, 11459"

