name: Build and Release

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build and Package
      shell: powershell
      run: |
        # Run the packaging script. It automatically compiles the C# app 
        # and generates the .zip files in the dist/ folder.
        # We extract the version from the tag (e.g., v1.0.1 -> 1.0.1)
        $version = "${{ github.ref_name }}".TrimStart('v')
        .\package.ps1 -Version $version

    - name: Create standardized release metadata
      id: metadata
      shell: powershell
      run: |
        .\scripts\New-ReleaseMetadata.ps1 `
          -Tag "${{ github.ref_name }}" `
          -Repository "${{ github.repository }}" `
          -OutputPath "dist\release-notes.md" `
          -GitHubOutputPath $env:GITHUB_OUTPUT

    - name: Attest release build provenance
      uses: actions/attest@v4
      with:
        subject-path: |
          dist/Offhand-v*.zip
          dist/Offhand-Companion.zip
          dist/Offhand-Complete-v*.zip
          dist/Offhand.exe
          dist/checksums-sha256.txt

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ steps.metadata.outputs.release_name }}
        body_path: dist/release-notes.md
        prerelease: ${{ steps.metadata.outputs.prerelease }}
        files: |
          dist/Offhand-v*.zip
          dist/Offhand-Companion.zip
          dist/Offhand-Complete-v*.zip
          dist/Offhand.exe
          dist/checksums-sha256.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


