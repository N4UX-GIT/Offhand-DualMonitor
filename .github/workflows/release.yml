name: Build and Release

env:
  # Addon-only releases reuse these exact, already-published Companion bytes.
  # Change both values only for a deliberate Companion release.
  COMPANION_RELEASE_TAG: v2.1.2-beta.20
  # Beta 20 was published under the legacy generic asset name. New releases
  # expose these bytes under a version-identifying filename.
  COMPANION_SOURCE_ARCHIVE_NAME: Offhand-Companion.zip
  COMPANION_ARCHIVE_NAME: Offhand-Companion-v2.1.2-beta.20.zip
  COMPANION_SHA256: 81EECE9430885CEAC178A44A42429854524279072305F9F94EE62E7CCD620CCB
  COMPANION_ARCHIVE_SHA256: C726444612DD740BE3F923B83704D155E21BC017F7C5FE245379B19DBECC76E3

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Prepared release to verify and stage
        type: choice
        options:
          - v2.1.5-beta.30
          - v2.1.5-beta.31
        default: v2.1.5-beta.31
        required: true
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build:
    if: github.event_name == 'push' && github.ref_name != 'v2.1.3' && github.ref_name != 'v2.1.3-beta.27' && github.ref_name != 'v2.1.5' && github.ref_name != 'v2.1.5-beta.28' && github.ref_name != 'v2.1.5-beta.29' && github.ref_name != 'v2.1.5-beta.30' && github.ref_name != 'v2.1.5-beta.31'
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Determine release lane
      id: policy
      shell: powershell
      run: |
        $changed = "${{ github.ref_name }}" -eq $env:COMPANION_RELEASE_TAG
        "companion_changed=$($changed.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Validate canonical Companion executable
      if: steps.policy.outputs.companion_changed == 'true'
      shell: powershell
      run: |
        $path = 'Companion\Offhand.exe'
        $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
        if ($actual -ne $env:COMPANION_SHA256) {
          throw "Checked-in Companion hash $actual does not match $env:COMPANION_SHA256."
        }
        if ((Get-Item -LiteralPath $path).VersionInfo.ProductVersion -ne '2.1.2-beta.20') {
          throw 'Checked-in Companion product version is not 2.1.2-beta.20.'
        }

    - name: Restore frozen Beta 20 Companion
      if: steps.policy.outputs.companion_changed != 'true'
      shell: powershell
      run: |
        .\scripts\Restore-FrozenCompanion.ps1 `
          -Tag $env:COMPANION_RELEASE_TAG `
          -ExpectedSha256 $env:COMPANION_SHA256

    - name: Build and Package
      shell: powershell
      run: |
        $version = "${{ github.ref_name }}".TrimStart('v')
        if ("${{ steps.policy.outputs.companion_changed }}" -eq "true") {
          .\package.ps1 -Version $version -CompanionChanged -UseExistingCompanion `
            -ExpectedCompanionSha256 $env:COMPANION_SHA256 `
            -ExpectedCompanionArchiveSha256 $env:COMPANION_ARCHIVE_SHA256 `
            -ExistingCompanionArchivePath "Companion\Offhand-Companion.zip"
        } else {
          .\package.ps1 -Version $version
        }

    - name: Validate canonical Companion archive
      if: steps.policy.outputs.companion_changed == 'true'
      shell: powershell
      run: |
        Add-Type -AssemblyName System.IO.Compression
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $archivePath = Join-Path 'dist' $env:COMPANION_ARCHIVE_NAME
        $archive = [IO.Compression.ZipFile]::OpenRead($archivePath)
        try {
          $expectedEntries = @('LICENSE', 'Offhand.exe', 'README.txt')
          foreach ($required in $expectedEntries) {
            if (-not $archive.GetEntry($required)) {
              throw "Companion archive is missing $required."
            }
          }
          $actualEntries = @($archive.Entries | ForEach-Object FullName | Sort-Object)
          if (($actualEntries -join "`n") -ne ($expectedEntries -join "`n")) {
            throw "Companion archive contains unexpected files: $($actualEntries -join ', ')"
          }
          $entry = $archive.GetEntry('Offhand.exe')
          $stream = $entry.Open()
          $sha256 = [Security.Cryptography.SHA256]::Create()
          try {
            $actual = ([BitConverter]::ToString($sha256.ComputeHash($stream))).Replace('-', '')
          } finally {
            $sha256.Dispose()
            $stream.Dispose()
          }
          if ($actual -ne $env:COMPANION_SHA256) {
            throw "Companion archive contains executable hash $actual, expected $env:COMPANION_SHA256."
          }
        } finally {
          $archive.Dispose()
        }
        $actualArchive = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash
        if ($actualArchive -ne $env:COMPANION_ARCHIVE_SHA256) {
          throw "Companion archive hash $actualArchive does not match $env:COMPANION_ARCHIVE_SHA256."
        }

    - name: Attach frozen Beta 20 Companion assets
      if: steps.policy.outputs.companion_changed != 'true'
      shell: powershell
      run: |
        .\scripts\Restore-FrozenCompanion.ps1 `
          -Tag $env:COMPANION_RELEASE_TAG `
          -ExpectedSha256 $env:COMPANION_SHA256 `
          -ArchiveDestination (Join-Path "dist" $env:COMPANION_ARCHIVE_NAME) `
          -ArchiveAssetName $env:COMPANION_SOURCE_ARCHIVE_NAME `
          -ExpectedArchiveSha256 $env:COMPANION_ARCHIVE_SHA256
        Copy-Item -LiteralPath "Companion\Offhand.exe" -Destination "dist\Offhand.exe" -Force
        foreach ($path in @((Join-Path "dist" $env:COMPANION_ARCHIVE_NAME), "dist\Offhand.exe")) {
          $file = Get-Item -LiteralPath $path
          $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
          "$hash  $($file.Name)" | Add-Content -LiteralPath "dist\checksums-sha256.txt" -Encoding UTF8
        }

    - name: Create standardized release metadata
      id: metadata
      shell: powershell
      run: |
        $arguments = @{
          Tag = "${{ github.ref_name }}"
          Repository = "${{ github.repository }}"
          CompanionReleaseTag = $env:COMPANION_RELEASE_TAG
          OutputPath = "dist\release-notes.md"
          GitHubOutputPath = $env:GITHUB_OUTPUT
        }
        if ("${{ steps.policy.outputs.companion_changed }}" -eq "true") {
          $arguments.CompanionChanged = $true
        }
        .\scripts\New-ReleaseMetadata.ps1 @arguments

    - name: Attest addon and complete bundle provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-path: |
          dist/Offhand-v*.zip
          dist/Offhand-Complete-v*.zip
          dist/checksums-sha256.txt

    - name: Attest updated Companion provenance
      if: steps.policy.outputs.companion_changed == 'true'
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-path: |
          dist/Offhand-Companion-v*.zip
          dist/Offhand.exe

    - name: Create Release and upload addon assets
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        name: ${{ steps.metadata.outputs.release_name }}
        body_path: dist/release-notes.md
        prerelease: ${{ steps.metadata.outputs.prerelease }}
        files: |
          dist/Offhand-v*.zip
          dist/Offhand-Companion-v*.zip
          dist/Offhand-Complete-v*.zip
          dist/Offhand.exe
          dist/checksums-sha256.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prepare-213:
    if: github.ref_name == 'v2.1.3' || github.ref_name == 'v2.1.3-beta.27'
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - name: Checkout matching release source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Validate frozen Companion and add-on beta safeguards
      shell: powershell
      run: ./tests/publication-213.ps1
    - name: Prepare Beta 27 add-on and exact frozen Companion assets
      shell: powershell
      run: ./scripts/Prepare-213Publication.ps1 -OutputDirectory dist/publication-2.1.3
    - name: Prepare add-on beta release notes
      if: github.ref_name == 'v2.1.3-beta.27'
      id: metadata
      shell: powershell
      run: |
        ./scripts/New-ReleaseMetadata.ps1 -Tag v2.1.3-beta.27 -CompanionReleaseTag v2.1.3 `
          -OutputPath dist/publication-2.1.3/release-notes.md `
          -GitHubOutputPath $env:GITHUB_OUTPUT
    - name: Attest publication provenance with separate component identities
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-path: |
          dist/publication-2.1.3/Offhand-v2.1.3-beta.27.zip
          dist/publication-2.1.3/Offhand-Complete-v2.1.3-beta.27.zip
          dist/publication-2.1.3/Offhand-Companion-v2.1.3.zip
          dist/publication-2.1.3/Offhand.exe
          dist/publication-2.1.3/publication.json
          dist/publication-2.1.3/checksums-sha256.txt
          dist/publication-2.1.3/companion-release/publication.json
          dist/publication-2.1.3/companion-release/checksums-sha256.txt
    - name: Stage the add-on as Pre-Release Beta 27
      if: github.ref_name == 'v2.1.3-beta.27'
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        name: ${{ steps.metadata.outputs.release_name }}
        body_path: dist/publication-2.1.3/release-notes.md
        draft: true
        prerelease: true
        files: |
          dist/publication-2.1.3/Offhand-v2.1.3-beta.27.zip
          dist/publication-2.1.3/Offhand-Complete-v2.1.3-beta.27.zip
          dist/publication-2.1.3/Offhand-Companion-v2.1.3.zip
          dist/publication-2.1.3/Offhand.exe
          dist/publication-2.1.3/publication.json
          dist/publication-2.1.3/checksums-sha256.txt
    - name: Stage the clean Companion release separately
      if: github.ref_name == 'v2.1.3'
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        name: Offhand Companion v2.1.3
        body_path: docs/COMPANION-2.1.3-RELEASE-NOTES.md
        draft: true
        prerelease: false
        files: |
          dist/publication-2.1.3/companion-release/Offhand-Companion-v2.1.3.zip
          dist/publication-2.1.3/companion-release/Offhand.exe
          dist/publication-2.1.3/companion-release/publication.json
          dist/publication-2.1.3/companion-release/checksums-sha256.txt

  prepare-215:
    if: github.ref_name == 'v2.1.5' || github.ref_name == 'v2.1.5-beta.28'
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - name: Checkout matching release source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Verify exact Store-matching Companion and add-on beta safeguards
      shell: powershell
      run: ./tests/publication-215.ps1
    - name: Prepare Beta 28 add-on and exact frozen Companion 2.1.5
      shell: powershell
      run: ./scripts/Prepare-215Publication.ps1 -OutputDirectory dist/publication-2.1.5
    - name: Prepare add-on release notes
      if: github.ref_name == 'v2.1.5-beta.28'
      shell: powershell
      run: ./scripts/New-ReleaseMetadata.ps1 -Tag v2.1.5-beta.28 -CompanionReleaseTag v2.1.5 -OutputPath dist/publication-2.1.5/release-notes.md
    - name: Attest publication artifacts
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-path: |
          dist/publication-2.1.5/Offhand-v2.1.5-beta.28.zip
          dist/publication-2.1.5/Offhand-Complete-v2.1.5-beta.28.zip
          dist/publication-2.1.5/Offhand-Companion-v2.1.5.zip
          dist/publication-2.1.5/Offhand.exe
          dist/publication-2.1.5/publication.json
          dist/publication-2.1.5/checksums-sha256.txt
          dist/publication-2.1.5/companion-release/publication.json
          dist/publication-2.1.5/companion-release/checksums-sha256.txt

    - name: Stage Pre-Release Beta 28
      if: github.ref_name == 'v2.1.5-beta.28'
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        name: Offhand v2.1.5 Pre-Release Beta 28
        body_path: dist/publication-2.1.5/release-notes.md
        draft: true
        prerelease: true
        files: |
          dist/publication-2.1.5/Offhand-v2.1.5-beta.28.zip
          dist/publication-2.1.5/Offhand-Complete-v2.1.5-beta.28.zip
          dist/publication-2.1.5/Offhand-Companion-v2.1.5.zip
          dist/publication-2.1.5/Offhand.exe
          dist/publication-2.1.5/publication.json
          dist/publication-2.1.5/checksums-sha256.txt
    - name: Stage Companion 2.1.5 separately
      if: github.ref_name == 'v2.1.5'
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        name: Offhand Companion v2.1.5
        body_path: docs/COMPANION-2.1.5-RELEASE-NOTES.md
        draft: true
        prerelease: false
        files: |
          dist/publication-2.1.5/companion-release/Offhand-Companion-v2.1.5.zip
          dist/publication-2.1.5/companion-release/Offhand.exe
          dist/publication-2.1.5/companion-release/publication.json
          dist/publication-2.1.5/companion-release/checksums-sha256.txt

  prepare-215-beta29:
    if: github.ref_name == 'v2.1.5-beta.29'
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - name: Checkout matching Beta 29 source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Configure Lua compiler
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
    - name: Install Lua 5.1
      uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
      with:
        luaVersion: "5.1.5"
    - name: Validate frozen source, artifact boundaries and release safeguards
      shell: powershell
      run: |
        python tests/publication-beta29.py
        if ($LASTEXITCODE -ne 0) { throw 'Beta 29 publication checks failed' }
        ./tests/release-metadata-beta29.ps1
        Get-ChildItem tests -Filter '*.lua' | ForEach-Object {
          lua $_.FullName
          if ($LASTEXITCODE -ne 0) { throw ('Lua suite failed: ' + $_.Name) }
        }
    - name: Preserve published releases
      shell: powershell
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python scripts/Assert-Beta29Draft.py
    - name: Prepare exact addon and unchanged Companion 2.1.5
      shell: powershell
      run: |
        python scripts/Prepare-Beta29Publication.py --output dist/publication-2.1.5-beta.29
        if ($LASTEXITCODE -ne 0) { throw 'Beta 29 preparation failed' }
        ./scripts/New-ReleaseMetadata.ps1 -Tag v2.1.5-beta.29 -CompanionReleaseTag v2.1.5 `
          -ChangelogPath docs/RELEASE-CHANGELOG-BETA29.md `
          -OutputPath dist/publication-2.1.5-beta.29/release-notes.md
    - name: Attest prepared release artifacts
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-path: |
          dist/publication-2.1.5-beta.29/Offhand-v2.1.5-beta.29.zip
          dist/publication-2.1.5-beta.29/Offhand-Complete-v2.1.5-beta.29.zip
          dist/publication-2.1.5-beta.29/Offhand-Companion-v2.1.5.zip
          dist/publication-2.1.5-beta.29/Offhand.exe
          dist/publication-2.1.5-beta.29/publication.json
          dist/publication-2.1.5-beta.29/checksums-sha256.txt
    - name: Stage Beta 29 as a draft prerelease
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        name: Offhand v2.1.5 Pre-Release Beta 29
        body_path: dist/publication-2.1.5-beta.29/release-notes.md
        draft: true
        prerelease: true
        make_latest: false
        files: |
          dist/publication-2.1.5-beta.29/Offhand-v2.1.5-beta.29.zip
          dist/publication-2.1.5-beta.29/Offhand-Complete-v2.1.5-beta.29.zip
          dist/publication-2.1.5-beta.29/Offhand-Companion-v2.1.5.zip
          dist/publication-2.1.5-beta.29/Offhand.exe
          dist/publication-2.1.5-beta.29/publication.json
          dist/publication-2.1.5-beta.29/checksums-sha256.txt

  prepare-215-beta30:
    if: github.ref_name == 'v2.1.5-beta.30' || (github.event_name == 'workflow_dispatch' && inputs.release_tag == 'v2.1.5-beta.30')
    runs-on: windows-latest
    defaults:
      run:
        working-directory: release-source
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - name: Checkout matching Beta 30 source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: v2.1.5-beta.30
        path: release-source
    - name: Configure Lua compiler
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
    - name: Install Lua 5.1
      uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
      with:
        luaVersion: "5.1.5"
    - name: Validate frozen source, artifact boundaries and release safeguards
      shell: powershell
      run: |
        python tests/publication-beta30.py
        if ($LASTEXITCODE -ne 0) { throw 'Beta 30 publication checks failed' }
        ./tests/release-metadata-beta30.ps1
        Get-ChildItem tests -Filter '*.lua' | ForEach-Object {
          lua $_.FullName
          if ($LASTEXITCODE -ne 0) { throw ('Lua suite failed: ' + $_.Name) }
        }
    - name: Preserve published releases
      shell: powershell
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python scripts/Assert-Beta30Draft.py
    - name: Prepare exact addon and unchanged Companion 2.1.5
      shell: powershell
      run: |
        python scripts/Prepare-Beta30Publication.py --output dist/publication-2.1.5-beta.30
        if ($LASTEXITCODE -ne 0) { throw 'Beta 30 preparation failed' }
        ./scripts/New-ReleaseMetadata.ps1 -Tag v2.1.5-beta.30 -CompanionReleaseTag v2.1.5 `
          -ChangelogPath docs/RELEASE-CHANGELOG-BETA30.md `
          -OutputPath dist/publication-2.1.5-beta.30/release-notes.md
    - name: Attest prepared release artifacts
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-path: |
          release-source/dist/publication-2.1.5-beta.30/Offhand-v2.1.5-beta.30.zip
          release-source/dist/publication-2.1.5-beta.30/Offhand-Complete-v2.1.5-beta.30.zip
          release-source/dist/publication-2.1.5-beta.30/Offhand-Companion-v2.1.5.zip
          release-source/dist/publication-2.1.5-beta.30/Offhand.exe
          release-source/dist/publication-2.1.5-beta.30/publication.json
          release-source/dist/publication-2.1.5-beta.30/checksums-sha256.txt
          release-source/dist/publication-2.1.5-beta.30/curseforge-changelog.md
    - name: Stage Beta 30 as a draft prerelease
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: v2.1.5-beta.30
        name: Offhand v2.1.5 Pre-Release Beta 30
        body_path: release-source/dist/publication-2.1.5-beta.30/release-notes.md
        draft: true
        prerelease: true
        make_latest: false
        files: |
          release-source/dist/publication-2.1.5-beta.30/Offhand-v2.1.5-beta.30.zip
          release-source/dist/publication-2.1.5-beta.30/Offhand-Complete-v2.1.5-beta.30.zip
          release-source/dist/publication-2.1.5-beta.30/Offhand-Companion-v2.1.5.zip
          release-source/dist/publication-2.1.5-beta.30/Offhand.exe
          release-source/dist/publication-2.1.5-beta.30/publication.json
          release-source/dist/publication-2.1.5-beta.30/checksums-sha256.txt
          release-source/dist/publication-2.1.5-beta.30/curseforge-changelog.md

  prepare-215-beta31:
    if: github.ref_name == 'v2.1.5-beta.31' || (github.event_name == 'workflow_dispatch' && inputs.release_tag == 'v2.1.5-beta.31')
    runs-on: windows-latest
    defaults:
      run:
        working-directory: release-source
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - name: Checkout matching Beta 31 source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: v2.1.5-beta.31
        path: release-source
    - name: Configure Lua compiler
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
    - name: Install Lua 5.1
      uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
      with:
        luaVersion: "5.1.5"
    - name: Preserve published releases
      shell: powershell
      env:
        GH_TOKEN: ${{ github.token }}
        OFFHAND_RELEASE_TAG: v2.1.5-beta.31
      run: |
        python scripts/Assert-Beta30Draft.py
    - name: Prepare exact addon and unchanged Companion 2.1.5
      shell: powershell
      run: |
        python scripts/Prepare-Beta31Publication.py dist/beta31
        if ($LASTEXITCODE -ne 0) { throw 'Beta 31 preparation failed' }
        ./scripts/New-ReleaseMetadata.ps1 -Tag v2.1.5-beta.31 -CompanionReleaseTag v2.1.5 `
          -ChangelogPath docs/RELEASE-CHANGELOG-BETA31.md `
          -OutputPath dist/beta31/release-notes.md
    - name: Attest prepared release artifacts
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-path: |
          release-source/dist/beta31/Offhand-v2.1.5-beta.31.zip
          release-source/dist/beta31/Offhand-Complete-v2.1.5-beta.31.zip
