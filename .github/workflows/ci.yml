name: CI

on:
  push:
    branches: [ main, addon/develop, companion/develop ]
  pull_request:
    branches: [ main, addon/develop, companion/develop ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Windows C compiler for Lua
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install Lua
        uses: leafo/gh-actions-lua@32909a2dea0a48c433aec79e7fcd31b4cd55800f # v13.1.0
        with:
          luaVersion: "5.1.5"

      - name: Run Unit Tests
        shell: pwsh
        run: |
          $failed = 0
          Get-ChildItem tests\ -Filter "*.lua" | ForEach-Object {
              Write-Host "Running $($_.Name)..." -ForegroundColor Cyan
              lua.exe "tests\$($_.Name)"
              if ($LASTEXITCODE -ne 0) {
                  $failed++
                  Write-Host "FAILED: $($_.Name)" -ForegroundColor Red
              }
          }
          if ($failed -gt 0) {
              throw "$failed test suites failed."
          }

      - name: Compile and test companion preferences and monitor selection
        shell: powershell
        run: ./tests/companion-preferences.ps1

      - name: Build Companion release executable
        shell: cmd
        run: Companion\build.bat
