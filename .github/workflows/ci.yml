name: CI

on:
  push:
    branches: [ main, addon/develop, companion/develop ]
  pull_request:
    branches: [ main, addon/develop, companion/develop ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Windows C compiler for Lua
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install Lua
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        with:
          luaVersion: "5.1.5"

      - name: Run Unit Tests
        shell: pwsh
        run: |
          $failed = 0
          Get-ChildItem tests\ -Filter "*.lua" | ForEach-Object {
              Write-Host "Running $($_.Name)..." -ForegroundColor Cyan
              lua.exe "tests\$($_.Name)"
              if ($LASTEXITCODE -ne 0) {
                  $failed++
                  Write-Host "FAILED: $($_.Name)" -ForegroundColor Red
              }
          }
          if ($failed -gt 0) {
              throw "$failed test suites failed."
          }

      - name: Compile and test companion preferences and monitor selection
        shell: powershell
        run: |
          ./tests/companion-preferences.ps1
          ./tests/companion-store-updates.ps1
          ./tests/companion-update-notices.ps1
          ./tests/companion-store-persistence.ps1

      - name: Verify frozen 2.1.3 publication assets and release scope
        shell: powershell
        run: |
          ./tests/publication-213.ps1 -HistoricalArtifactsOnly
          ./tests/publication-215.ps1 -HistoricalArtifactsOnly
          # The Beta 29 fixture verifies the frozen 2.1.5 inputs against their receipt.
          git fetch --no-tags --depth=1 origin 7bc07a60113c7c990067d5fd86215ace310399cc
          if ($LASTEXITCODE -ne 0) { throw 'Frozen Companion 2.1.5 source is unavailable' }
          python tests/publication-beta29.py
          if ($LASTEXITCODE -ne 0) { throw 'Beta 29 publication checks failed' }
          ./tests/release-metadata.ps1
          ./tests/release-metadata-beta29.ps1

      - name: Test monitor identity ambiguity and workspace migration
        shell: powershell
        run: ./tests/companion-display-selection.ps1

      - name: Characterize partial topology writer and Lua consumer
        shell: powershell
        run: ./tests/companion-partial-topology.ps1

      - name: Test panel scaling metadata across Companion and addon
        shell: powershell
        run: ./tests/companion-region-scale.ps1

      - name: Test multiple regions and named workspace plans
        shell: powershell
        run: |
          ./tests/companion-workspace-regions.ps1
          ./tests/companion-workspace-profiles.ps1
          ./tests/companion-layout-document.ps1
          ./tests/companion-flexible-layouts.ps1

      - name: Test third monitor and taskbar presentation policies
        shell: powershell
        run: |
          ./tests/companion-third-monitor.ps1
          ./tests/companion-four-monitors.ps1
          ./tests/companion-taskbar-presentation.ps1

      - name: Test production and experimental Companion recovery policies
        shell: powershell
        run: |
          ./tests/companion-graphics-recovery.ps1 -Production
          ./tests/companion-graphics-recovery.ps1
          ./tests/companion-graphics-recovery.ps1 -Retail
          ./tests/companion-graphics-recovery.ps1 -Forever

      - name: Test Companion span rollback with synthetic windows
        shell: powershell
        run: ./tests/companion-span-rollback.ps1

      - name: Test Companion display diagnostics and dashboard
        shell: powershell
        run: |
          ./tests/companion-color.ps1
          ./tests/companion-color.ps1 -DiagnosticsTest

      - name: Build Companion release executable
        shell: cmd
        run: Companion\build.bat

      - name: Validate unsigned Store package structure and executable parity
        shell: powershell
        run: |
          $expectedHash = (Get-FileHash ./Companion/Offhand.exe -Algorithm SHA256).Hash
          $validationOutput = Join-Path $env:RUNNER_TEMP 'Offhand-StoreValidation'
          ./Companion/Store/Build-StorePackage.ps1 -PackageVersion 1.0.0.0 -IdentityName N4UX.OffhandCompanion.Validation -OutputDirectory $validationOutput -CompanionPath ./Companion/Offhand.exe -ExpectedCompanionSha256 $expectedHash
          ./tests/companion-store-package.ps1 -PackagePath (Join-Path $validationOutput 'Offhand-Companion_1_0_0_0_x64.msix') -ExpectedCompanionSha256 $expectedHash -ExpectedPackageVersion 1.0.0.0 -ExpectedIdentityName N4UX.OffhandCompanion.Validation
